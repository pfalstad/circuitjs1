name: Build

on:
  push:
    branches: [ dev-ts ]
  pull_request:
    branches: [ dev-ts ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ts/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ts

    - name: Build
      run: npm run build
      working-directory: ts

    - name: Run tests
      run: npm test
      working-directory: ts
