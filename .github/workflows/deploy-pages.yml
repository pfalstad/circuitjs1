name: Deploy to GitHub Pages

on:
  push:
    branches: [ dev-ts ]   # ← Only trigger on pushes to dev-ts

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ts

      # Mark the GitHub Pages build as alpha, with its build time, in the
      # version string (shown in the title bar and About box). Only the
      # checked-out copy is changed.
      - name: Mark version as alpha with build time
        run: |
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          sed -E -i "s/(versionString: string = \"[^\"]*)\"/\1 (alpha $BUILT)\"/" ts/src/CirSim.ts
          grep 'versionString: string = ".* (alpha .*)"' ts/src/CirSim.ts

      - name: Build site
        run: ./dist-offline.sh


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
