<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Studio</title>
<link rel="icon" href="icon128.png">
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
  --text: #e6e8ec; --muted: #9aa3b2; --accent: #f5b83d; --accent-ink: #1a1405;
  --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; gap: 12px; align-items: center; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap;
}
.brand { font-weight: 700; letter-spacing: .2px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand img { width: 22px; height: 22px; }
form#ask { flex: 1; display: flex; gap: 8px; min-width: 260px; }
#prompt {
  flex: 1; min-width: 0; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 12px; font: inherit;
}
#prompt:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button {
  font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2);
  color: var(--text); padding: 8px 12px; cursor: pointer; white-space: nowrap;
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .55; cursor: progress; }
.examples { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.examples button { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; color: var(--muted); }
.examples button:hover { color: var(--text); }
#status { padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2); display: none; }
#status.show { display: block; }
#status .title { font-weight: 600; }
#status .step { color: var(--muted); }
#status ul { margin: 4px 0 0; padding-left: 18px; }
#status .warn { color: var(--warn); }
#status .err { color: var(--err); }
main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.pane { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pane + .pane { border-left: 1px solid var(--line); }
.pane-head {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12.5px;
  color: var(--muted); border-bottom: 1px solid var(--line); background: var(--panel);
}
.pane-head .spacer { flex: 1; }
.pane-head label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.pane-head button { padding: 3px 9px; font-size: 12px; }
#sim { flex: 1; width: 100%; border: 0; background: #000; }
#view3d { flex: 1; position: relative; overflow: hidden; }
#view3d canvas { display: block; width: 100%; height: 100%; }
#tip {
  position: absolute; pointer-events: none; background: rgba(23,26,33,.95); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 9px; font-size: 12px; white-space: pre; display: none; z-index: 2;
}
.legend {
  position: absolute; left: 12px; bottom: 12px; font-size: 11.5px; color: var(--muted);
  background: rgba(15,17,21,.8); padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line);
}
.legend .bar { width: 140px; height: 8px; border-radius: 4px; margin: 4px 0 2px;
  background: linear-gradient(90deg, #3b82f6, #6b7280, #ef4444); }
.legend .scale { display: flex; justify-content: space-between; }
.tabs { display: none; }
@media (max-width: 820px) {
  header { padding: 10px 16px; }
  main { grid-template-columns: 1fr; }
  .pane + .pane { border-left: 0; }
  .examples { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .examples button { flex: none; }
  .tabs { display: flex; gap: 6px; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .tabs button.active { border-color: var(--accent); color: var(--accent); }
  body[data-tab="sim"] #pane3d, body[data-tab="3d"] #paneSim { display: none; }
}
</style>
<script type="importmap">
{ "imports": { "three": "./studio/vendor/three.module.min.js" } }
</script>
</head>
<body data-tab="sim">
<header>
  <div class="brand"><img src="icon128.png" alt="">Circuit Studio</div>
  <form id="ask">
    <input id="prompt" autocomplete="off" placeholder="Describe a circuit, e.g. &quot;a red LED blinking from a 9 V battery&quot;" aria-label="Describe the circuit to build">
    <button class="primary" id="buildBtn" type="submit">Build with AI</button>
  </form>
</header>
<div class="examples" id="examples" aria-label="Example requests"></div>
<div id="status" role="status" aria-live="polite"></div>
<div class="tabs" role="tablist">
  <button data-tab="sim" class="active" role="tab">Schematic</button>
  <button data-tab="3d" role="tab">3D board</button>
</div>
<main>
  <section class="pane" id="paneSim">
    <div class="pane-head">Schematic and simulation (CircuitJS)</div>
    <iframe id="sim" src="circuitjs.html" title="Circuit simulator"></iframe>
  </section>
  <section class="pane" id="pane3d">
    <div class="pane-head">
      3D board
      <span class="spacer"></span>
      <label><input type="checkbox" id="voltToggle" checked> Voltage colours</label>
      <button id="resetView" type="button">Reset view</button>
    </div>
    <div id="view3d">
      <div id="tip"></div>
      <div class="legend" id="legend">
        Trace voltage
        <div class="bar"></div>
        <div class="scale"><span>-10 V</span><span>0</span><span>+10 V</span></div>
      </div>
    </div>
  </section>
</main>
<script type="module" src="studio/main.js"></script>
</body>
</html>
